<style>
*{box-sizing:border-box}body{margin:0;background:#080d19;color:#ecf6ff;font:15px system-ui,sans-serif}main{width:min(1010px,100%);margin:auto;padding:16px}header,.hud{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap}header{margin-bottom:10px}strong,h1,h2{letter-spacing:-.035em}header strong{font-size:22px}.hud{background:#101b2b;padding:9px 12px;border:1px solid #254563;color:#b4dcf8;font-size:13px;margin-bottom:8px}.field{position:relative;border:1px solid #315777;border-radius:9px;overflow:hidden;background:#090f1d}canvas{display:block;width:100%;height:min(74vh,680px);min-height:355px;touch-action:none}.panel{position:absolute;inset:0;display:grid;place-items:center;background:#050a14d9;padding:12px;overflow:auto}.panel[hidden]{display:none}.box{width:min(720px,100%);max-height:100%;overflow:auto;background:#101b2bf5;border:1px solid #38607d;border-radius:10px;padding:clamp(14px,3vw,26px)}h1,h2,p{margin:0 0 10px}p,small{color:#b4c8df}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px;margin:14px 0}.split{display:grid;grid-template-columns:1fr 2fr;gap:14px}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}button{border:1px solid #47718d;background:#17283c;color:#eff9ff;border-radius:6px;padding:9px 12px;font:inherit;cursor:pointer;text-align:left}button:hover,button:focus-visible{border-color:#6be2ff;outline:1px solid #6be2ff}button[disabled]{cursor:default;opacity:.45}.primary{background:#075269;border-color:#64dcff}.card{display:grid;align-content:start;gap:4px}.card span{color:#82e1ff;font-size:13px}.sym{color:#f8ce72}.stat{margin:0;padding-left:18px;color:#b2c9df}.options{display:grid;gap:10px;margin:12px 0}.options label{display:grid;grid-template-columns:100px 1fr;align-items:center;gap:8px}footer{margin-top:8px;color:#a6bdd4;font-size:12px}@media(max-width:560px){main{padding:8px}.split{grid-template-columns:1fr;gap:6px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hud{font-size:11px}.box{padding:12px}}

<style>
:root{--ink:#edf8ff;--muted:#a2bbd4;--accent:#66e3ff;--line:#28445c;--gold:#ffd483;--surface:#0d192a}
body{background:radial-gradient(ellipse at 50% -30%,#173958 0%,#0b1526 43%,#070c17 77%);color:var(--ink)}
main{width:min(1080px,100%);padding:clamp(9px,2.4vw,24px)}
header{margin-bottom:13px}
.brand{display:flex;gap:11px;align-items:center}
.brand-mark{width:29px;height:29px;display:grid;place-items:center;border:1px solid #67d9ed;border-radius:7px;color:var(--accent);box-shadow:inset 0 0 15px #67d9ed24}
.brand strong{font-size:clamp(17px,3vw,23px);font-weight:800;letter-spacing:.08em}
.hud{display:grid;grid-template-columns:auto auto repeat(3,minmax(70px,1fr)) auto auto;gap:10px 17px;background:#0a1728;border-color:#2f546e;border-radius:7px;padding:8px 12px;min-height:42px}
.hud span{white-space:nowrap}.hud strong{display:block;color:var(--ink);font-size:13px;line-height:1.2}
.hud small{display:block;color:var(--muted);font-size:10px;letter-spacing:.035em}
.hud meter{width:100%;height:8px;display:block;accent-color:var(--accent)}
.hud meter::-webkit-meter-bar{background:#21334a;border:0;border-radius:3px}
.hud meter::-webkit-meter-optimum-value{background:var(--meter,var(--accent));border-radius:3px}
.hud meter::-moz-meter-bar{background:var(--meter,var(--accent));border-radius:3px}
.hud .credits strong{color:var(--gold)}
.field{border-color:#2a526d;box-shadow:0 16px 40px #0006}
.panel{background:#050b18bd}
.box{max-width:100%;background:linear-gradient(145deg,#122539fa,#0b1525fa 72%);box-shadow:0 18px 65px #0008;border-color:#48687e}
.box h2{font-size:clamp(21px,3.5vw,34px);line-height:1.13}
.panel[data-screen="level"] .grid{grid-template-columns:1fr;margin:0}
.panel[data-screen="level"] .split{grid-template-columns:minmax(160px,1fr) minmax(210px,1.6fr);margin:16px 0}
.panel[data-screen="level"] .card{min-height:67px}
.panel[data-screen="level"] .stat,.panel[data-screen="shop"] .stat,.panel[data-screen="result"] .stat{display:grid;gap:3px}
.card{background:linear-gradient(120deg,#182e45,#111f32);border-color:#395f7f;position:relative}
.card strong{font-size:15px}
.card span{line-height:1.4}
.card .choice{font-size:10px;letter-spacing:.06em;color:#a9c1d8}
.card[data-kind="copy"]{border-left:4px solid #b295ff}
.card[data-kind="stat"]{border-left:4px solid #74d7fa}
.card[data-kind="support"]{border-left:4px solid #74dfba}
.card[data-rank="4"] span{color:var(--gold)}
.card:hover:not(:disabled),.card:focus-visible{background:linear-gradient(120deg,#214769,#172b41)}
button.primary{background:linear-gradient(120deg,#0c4157,#0a3045);border-color:#5edaff;box-shadow:inset 0 0 12px #44ceff21}
.hangar-grid{display:grid;grid-template-columns:1fr 1.45fr;gap:16px;align-items:center}
.hangar-preview{width:100%;height:auto;min-height:0;aspect-ratio:5/4;background:radial-gradient(ellipse at center,#194a71,#102236 60%,#0b1525);border:1px solid #365671;border-radius:8px;touch-action:auto}
.hangar-grid .grid{grid-template-columns:repeat(2,minmax(0,1fr));margin:8px 0}
.hangar-grid .card{min-height:63px}
.hangar-grid .card[aria-pressed="true"]{border-color:var(--accent);background:#173b52}
.stage-route{display:flex;align-items:center;gap:7px;margin:12px 0;color:var(--muted);font-size:12px}
.stage-route i{height:1px;flex:1;background:linear-gradient(90deg,#446585,var(--accent))}
.stage-route strong{color:var(--gold)}
summary{cursor:pointer;color:var(--accent);font-size:12px;margin-top:8px}
.options input{width:100%;accent-color:var(--accent)}
@media(max-width:680px){.hud{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:7px}.hud strong{font-size:11px}.hud small{font-size:9px}}
@media(max-width:540px){.hangar-grid,.panel[data-screen="level"] .split{grid-template-columns:1fr}.hangar-preview{max-height:116px}.panel[data-screen="level"] .split{gap:10px}.panel[data-screen="level"] .card{min-height:0}.box h2{font-size:21px}.buttons button{font-size:13px}}
.header-controls{display:flex;align-items:center;gap:6px}
.header-controls button{padding:6px 9px;font-size:12px}
.joystick{position:absolute;right:clamp(12px,3vw,28px);bottom:clamp(12px,3vw,25px);z-index:1;width:clamp(80px,24vw,112px);aspect-ratio:1;border-radius:50%;background:#080a0de8;border:1px solid #748194;box-shadow:0 4px 18px #0009;touch-action:none;user-select:none}
.joystick[hidden]{display:none}
.joystick::before,.joystick::after{content:"";position:absolute;background:#3a414a;pointer-events:none}
.joystick::before{left:12%;right:12%;top:50%;height:1px}
.joystick::after{top:12%;bottom:12%;left:50%;width:1px}
.joystick-knob{position:absolute;left:50%;top:50%;width:44%;height:44%;border-radius:50%;background:#121418;border:1px solid #9ea9b5;box-shadow:inset 0 0 8px #ffffff18;transform:translate(calc(-50% + var(--stick-x,0px)),calc(-50% + var(--stick-y,0px)));pointer-events:none;z-index:1}
.panel{z-index:2}
@media(max-width:680px),(pointer:coarse) and (max-height:780px){
  html,body{margin:0;overscroll-behavior:none}
  main{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:7px 8px max(7px,env(safe-area-inset-bottom))}
  header{flex:none;margin-bottom:6px;gap:5px}
  .brand{gap:5px}.brand-mark{width:21px;height:21px}.brand strong{font-size:15px}
  .header-controls button{font-size:10px;padding:5px 6px}
  .hud{flex:none;margin-bottom:5px;padding:5px 6px;min-height:0}
  .field{flex:1;min-height:0;box-shadow:none}
  #canvas{position:absolute;inset:0;width:100%;height:100%;min-height:0}
  .panel{padding:5px}
  .box{max-height:100%;overscroll-behavior:contain}
  footer{flex:none;margin-top:5px;font-size:10px;line-height:1.25}
}
@media(pointer:coarse){.desktop-help{display:none}}
@media(pointer:fine){.touch-help{display:none}}
.hangar-preview{object-fit:contain}
.launch-actions{align-items:center}
.stick-recommend{display:none}
@media(pointer:coarse){
  .stick-recommend{display:inline-flex;color:var(--accent);font-size:11px;padding:7px 8px;align-items:center}
  .stick-recommend[aria-pressed="true"]{border-color:#5599aa;background:#123044}
}
@media(max-width:540px){
  .hangar-preview{height:clamp(104px,18dvh,145px);max-height:none;aspect-ratio:auto}
  .launch-actions{gap:6px}
}
</style>
<style>
.joystick{left:clamp(12px,3vw,28px);right:auto}
.joystick-label{position:absolute;bottom:7px;left:0;width:100%;text-align:center;color:#b9d3e8;font-size:10px;letter-spacing:.08em;pointer-events:none}
.throttle{position:absolute;right:clamp(12px,3vw,28px);bottom:clamp(12px,3vw,25px);z-index:1;width:clamp(76px,22vw,98px);aspect-ratio:1;border-radius:50%;border:1px solid #cb994e;background:#15120fee;color:#ffd58a;font-weight:750;text-align:center;touch-action:none;user-select:none}
.throttle[hidden]{display:none}.throttle[aria-pressed="true"]{color:#1e150b;background:#ffd17b}
.hull-pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0 12px}
.hull-pick button[aria-pressed="true"]{border-color:#6be2ff;background:#133c55}
.hull-pick #hull1[aria-pressed="true"]{border-color:#ffd17b;background:#43301b}
.hull-pick strong,.hull-pick small{display:block}
.hud .flight strong{color:#ffd483}
.hud{grid-template-columns:auto auto repeat(4,minmax(55px,1fr)) auto auto}
.dash-control{position:absolute;right:clamp(12px,3vw,28px);bottom:calc(clamp(12px,3vw,25px) + clamp(76px,22vw,98px) + 10px);z-index:1;width:clamp(59px,17vw,74px);aspect-ratio:1;border-radius:50%;border:1px solid #8a92aa;background:#121927ef;color:#e5e7ff;text-align:center;font-size:12px;font-weight:750;touch-action:none;user-select:none}
.dash-control[hidden]{display:none}.dash-control:not(:disabled){border-color:#baabff;color:#e1d7ff;box-shadow:inset 0 0 16px #7a5bea70}
@media(max-width:680px){.hud{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(pointer:coarse) and (orientation:landscape){
  main{padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
  .joystick{width:72px;bottom:9px}.throttle{width:60px;bottom:9px}
  .dash-control{width:48px;bottom:77px;font-size:10px}
  .hud{grid-template-columns:auto auto repeat(4,minmax(35px,1fr)) auto auto;gap:8px}
  .hangar-preview{max-height:145px}
}
</style>

function loadArtwork(){
  if(typeof Image==='undefined')return;
  const power=new Image();
  power.onload=()=>{artwork.power=power;};
  power.src=powerImage;
  const speed=new Image();
  speed.onload=()=>{artwork.player0=speed;const preview=$('hangarShip0');if(preview)preview.drawn=-1;};
  speed.src=speedImage;
  for(const {data,cutouts} of sheets){
    const source=new Image();
    source.onload=()=>{
      for(const [name,x,y,w,h,mask] of cutouts){
        const sprite=document.createElement('canvas');
        sprite.width=w;sprite.height=h;
        const draw=sprite.getContext('2d');
        if(mask){
          draw.beginPath();
          mask.forEach(([px,py],i)=>i?draw.lineTo(px*w,py*h):draw.moveTo(px*w,py*h));
          draw.closePath();draw.clip();
        }
        draw.drawImage(source,x/2,y/2,w/2,h/2,0,0,w,h);
        const pixels=draw.getImageData(0,0,w,h), p=pixels.data;
        for(let i=0;i<p.length;i+=4){
          const signal=Math.max(p[i]-12,p[i+1]-22,p[i+2]-41);
          p[i+3]=Math.round(p[i+3]*Math.min(1,Math.max(0,signal/21)));
        }
        draw.putImageData(pixels,0,0);
        artwork[name]=sprite;
      }
    };
    source.src=data;
  }
}
function drawArt(name,x,y,width,height){
  const image=artwork[name];
  if(!image)return false;
  const scale=Math.min(width/image.width,height/image.height);
  const w=image.width*scale,h=image.height*scale;
  ctx.drawImage(image,x-w/2,y-h/2,w,h);
  return true;
}

function sound(freq,duration,gain=1,music=false,wave=music?'sine':'triangle',endFrequency=freq){
  const volume=(music?prefs.music:prefs.fx)/100;
  if(!audio||!volume||audio.state!=='running')return;
  const osc=audio.createOscillator(), amp=audio.createGain();
  osc.type=wave;osc.frequency.setValueAtTime(freq,audio.currentTime);
  if(endFrequency!==freq)osc.frequency.exponentialRampToValueAtTime(endFrequency,audio.currentTime+duration);
  amp.gain.setValueAtTime(.045*gain*volume,audio.currentTime);
  amp.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+duration);
  osc.connect(amp);amp.connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration);
}

function syncCombatOst(){
  const shouldPlay=mode==='combat'&&prefs.music>0;
  if(!shouldPlay){
    if(!combatOst.paused)combatOst.pause();
    if(!['combat','pause','level'].includes(mode)&&combatOst.currentTime)combatOst.currentTime=0;
    return;
  }
  const selected=prefs.combatTrack==='opening'?'opening':'battle';
  if(selected!==combatTrack){
    combatTrack=selected;
    combatPlayRequest++;
    combatPlayPending=false;combatPlayFailed=false;
    combatOst.pause();combatOst.src=combatTracks[selected];
  }
  combatOst.volume=prefs.music/100;
  if(combatOst.paused&&!combatPlayPending&&!combatPlayFailed){
    const request=++combatPlayRequest;
    combatPlayPending=true;
    combatOst.play().then(()=>{
      if(request!==combatPlayRequest)return;
      combatPlayPending=false;
      if(mode!=='combat'||!prefs.music)combatOst.pause();
    }).catch(error=>{
      if(request!==combatPlayRequest)return;
      combatPlayPending=false;
      if(mode!=='combat'||!prefs.music||error?.name==='AbortError')return;
      const backup='https://raw.githubusercontent.com/daning1212/orbit-rogue-space-combat-roguelike/main/'+combatTracks[combatTrack];
      if(error?.name!=='NotAllowedError'&&combatOst.getAttribute('src')!==backup){
        combatOst.src=backup;
        syncCombatOst();
      }else combatPlayFailed=true;
    });
  }
}
function playMusic(now){
  syncCombatOst();
  if(mode==='combat'&&!combatPlayFailed)return;
  if(!['combat','boss'].includes(mode)||!audio||audio.state!=='running'||!prefs.music)return;
  if(mode==='boss'&&activeBossOst&&!activeBossOst.paused)return;
  if(musicPhase!==mode){musicPhase=mode;musicStep=0;musicAt=now;}
  if(now<musicAt)return;
  const sixteenth=60000/(mode==='boss'?190:178)/4;
  musicAt=now-musicAt>sixteenth?now+sixteenth:musicAt+sixteenth;
  const beat=musicStep%16, bar=musicBars[Math.floor(musicStep/16)%musicBars.length];
  if(beat===0||beat===8)sound(110,.10,1.45,true,'sine',48);
  if(beat===4||beat===12)sound(240,.065,.42,true,'triangle',125);
  if(beat%4===2)sound(1750,.018,.17,true,'square',950);
  if(beat===0||beat===3||beat===8||beat===11)musicTone(bar.bass+(beat===8?7:0),.16,.76,'triangle');
  if(beat===2||beat===6||beat===10||beat===14)
    for(const note of bar.chord)musicTone(note,.10,.20,'square');
  const note=bar.lead[beat];
  if(note!==null)musicTone(note,beat%4===0?.18:.12,beat%4===0?.72:.57,'square');
  musicStep++;
}

  const button=$('ostToggle');
  if(button)button.textContent=mainOst.paused?tr('♪ Main OST 듣기','♪ Play Main OST'):tr('Ⅱ OST 정지','Ⅱ Pause OST');
}
function fadeMainOst(target,duration=700,done){
  clearInterval(ostFade);
  const from=mainOst.volume,start=performance.now();
  ostFade=setInterval(()=>{
    const p=Math.min(1,(performance.now()-start)/duration);
    mainOst.volume=from+(target-from)*p;
    if(p>=1){clearInterval(ostFade);ostFade=null;if(done)done();}
  },30);
}
let menuOstRequest=0;
function stopMenuOst(){
  menuOstRequest++;
  clearInterval(ostFade);ostFade=null;
  mainOst.pause();
  if(mainOst.currentTime)mainOst.currentTime=0;
  updateOstButton();
}
function startMenuOst(){
  if(!prefs.music)return;
  const target=menuOstVolume();
  if(mainOst.paused){
    const request=++menuOstRequest;
    mainOst.volume=0;
    mainOst.play().then(()=>{
      if(request===menuOstRequest&&['hangar','settings'].includes(mode))fadeMainOst(target,900);
    }).catch(()=>{});
  }
  else fadeMainOst(target,250);
  updateOstButton();
}
function saveAudioPreference(key,value){
  prefs[key]=Number(value);store.set('or-settings',prefs);
  if(key==='music'){
    if(!mainOst.paused)mainOst.volume=menuOstVolume();
    combatOst.volume=prefs.music/100;
    syncCombatOst();
    if(activeBossOst&&!activeBossOst.paused)activeBossOst.volume=prefs.music/100;
  }else sound(420,.13);
}
function fadeBossOst(track,target,duration=850,done){
  clearInterval(bossFade);
  const from=track.volume,start=performance.now();
  bossFade=setInterval(()=>{
    const p=Math.min(1,(performance.now()-start)/duration);
    track.volume=from+(target-from)*p;
    if(p>=1){clearInterval(bossFade);bossFade=null;if(done)done();}
  },30);
}
function startBossOst(){

function stopBossOst(duration=650){

  const track=activeBossOst;

function xpGoal(){

const WEAPON_LIMIT=weapons.length;
const WEAPON_CARD_POINTS=[1,2,3,5,8];
const WEAPON_UPGRADE_POINTS=[2,6,12,20,25];
const makeWeapon=id=>({id,rank:0,copies:0,mastered:false,prestige:0});
function inventory(){
  return run.weaponSlots??=[{...makeWeapon(run.wp),rank:run.rank,copies:run.copies,mastered:run.mastered}];
}
function syncPrimary(){
  const [slot]=inventory();
  Object.assign(run,{wp:slot.id,rank:slot.rank,copies:slot.copies,mastered:slot.mastered});
}
function replacementSlot(id){
  const slots=inventory();
  return slots.find(s=>Math.floor(s.id/2)===Math.floor(id/2))
    ?? slots.reduce((best,s)=>s.rank<best.rank? s:best);
}
function weaponCard(id,offeredRank){
  const slot=inventory().find(s=>s.id===id);
  if(!slot){
    const swap=inventory().length>=WEAPON_LIMIT?replacementSlot(id):null;
    return {type:'equip',id,name:weapons[id],text:swap?'교체 · '+weapons[swap.id]+' 대신 장착':'빈 무기 칸에 장착'};
  }
  const rank=offeredRank??rollWeaponCardRank(slot.rank),points=WEAPON_CARD_POINTS[rank];
  const need=WEAPON_UPGRADE_POINTS[slot.rank],total=slot.copies+points;
  const next=slot.rank<4?ranks[slot.rank+1]:slot.mastered?'레전드 중첩 +1':'레전드 완성';
  return {type:'copy',id,rank,name:weapons[id],text:
    '+'+points+' 중첩점 · '+total+'/'+need+(total>=need?' → '+next:'')};
}
function rollWeaponCardRank(maxRank){
  const luck=run.luck??0,roll=Math.random();
  if(run.stage>=18){
    const late=run.stage-18;
    if(roll<Math.min(.36,.08+late*.075+luck*.002))return 4;
    if(roll<Math.min(.62,.28+late*.10+luck*.003))return 3;
    if(roll<Math.min(.93,.74+late*.07+luck*.002))return 2;
    return 1;
  }
  const chance=clamp(.32+luck*.006,.25,.56);
  let rank=0;
  while(rank<maxRank&&roll<chance**(rank+1))rank++;
  return rank;
}
function levelOffers(){
  const slots=inventory(), ownedChance=clamp(.26+run.luck*.012,.14,.76);
  return [0,2,4].map(first=>{
    const pool=[first,first+1], held=pool.filter(id=>slots.some(s=>s.id===id));
    const fresh=pool.filter(id=>!held.includes(id));
    return weaponCard(pick(held.length&&(!fresh.length||Math.random()<ownedChance)?held:fresh));
  });
}
function levelChoices(){
  const choices=levelOffers();
  if(Math.random()<.75){
    choices.splice(Math.floor(Math.random()*choices.length),1,Math.random()<.8?statCard():supportCard());
  }
  return choices;
}

function supportCard(){
  const used=run.support.filter(Boolean).length;
  const possible=run.support.map((n,i)=>({n,i})).filter(({n})=>n<3&&(n>0||used<3));
  if(!possible.length) return {type:'heal',name:'정비 키트',text:'내구도 25 즉시 회복'};
  const {n,i}=pick(possible);
  return {type:'support',id:i,name:modules[i],text:(n?'강화 ':'장착 ')+(n+1)+'/3 · '+['피해 누적 시 원형 반격','표식과 보조 사격','동료기를 출격시켜 공격','보석 회수 반경 증가'][i]};

function apply(card){
  if(['stat','trade'].includes(card.type)){
    const rewards=run.rewardHistory??={};
    const reward=rewards[card.name]??={type:card.type,count:0};
    reward.count++;
  }
  if(card.type==='copy'){
    const slot=inventory().find(s=>s.id===card.id);
    if(!slot)return;
    slot.copies+=WEAPON_CARD_POINTS[card.rank??0];
    while(slot.copies>=WEAPON_UPGRADE_POINTS[slot.rank]){
      slot.copies-=WEAPON_UPGRADE_POINTS[slot.rank];
      if(slot.rank<4)slot.rank++;
      else if(slot.mastered)slot.prestige++;
      else slot.mastered=true;
    }
    syncPrimary();
  }else if(card.type==='equip'){
    const slots=inventory();
    if(slots.some(s=>s.id===card.id))return;
    if(slots.length<WEAPON_LIMIT)slots.push({...makeWeapon(card.id),acquiredStage:run.stage});
    else slots[slots.indexOf(replacementSlot(card.id))]=makeWeapon(card.id);
    syncPrimary();
  }else if(card.type==='stat'||card.type==='trade'){
    for(const [id,delta] of Object.entries(card.changes??{[card.id]:card.value})){
      run[id]+=delta;
      if(id==='max')run.hp=Math.min(run.max,run.hp+Math.max(0,delta));
      if(id==='shieldMax')run.shield=Math.min(run.shieldMax,run.shield+Math.max(0,delta));
    }
  }else if(card.type==='support')run.support[card.id]++;
  else if(card.type==='heal')run.hp=Math.min(run.max,run.hp+25);
}

function tuneShopEquipment(card,stage){
  const multiplier=stage>=18?1.5:stage>=14?1.3:stage>=10?1.15:1;
  const changes=Object.fromEntries(Object.entries(card.changes).map(([id,delta])=>{
    const value=delta<=0?delta:Number((delta*multiplier).toFixed(2));
    return [id,delta>=1?Math.round(value):value];
  }));

}
function newStock(reserved=[]){
  const offers=Array.from({length:4},(_,i)=>reserved[i]?.locked?refreshWeaponOffer(reserved[i],reserved[i].price):null);
  const weapons=levelOffers();
  const first=weapons.splice(Math.floor(Math.random()*weapons.length),1)[0];
  const upgrades=tradeoffGear.filter(canInstallTradeoff);
  const candidates=[{...first,group:'weapon'},{...pick(weapons),group:'weapon'},
    upgrades.length?tuneShopEquipment(pick(upgrades),run.stage):{...statCard(),group:'ship'},
    {...supportCard(),group:'support'}];
  const key=c=>c.group==='weapon'?'weapon:'+c.id:c.name;
  const used=new Set(offers.filter(Boolean).map(key));
  for(let index=0;index<offers.length;index++){
    if(offers[index])continue;
    const preferred=candidates[index];
    const card=!used.has(key(preferred))?preferred:candidates.find(c=>!used.has(key(c)))??{...statCard(),group:'ship'};
    used.add(key(card));
    offers[index]={...card,price:shopListPrice(card,run.stage,index)};
  }
  return offers;
}

    meter('실드',Math.ceil(run.shield),run.shieldMax,'#64dfff')+
    meter('내구도',Math.max(0,Math.ceil(run.hp)),run.max,'#73e4ae')+
    meter('경험치 · Lv.'+run.level,run.xp,xpGoal(),'#b995ff')+
    meter('대시',Math.floor(100*run.dash),100,'#d1acff')+
    field('코인',run.coin,'credits')+field('점수',run.score.toLocaleString()));
}
function frame(now){
  const dt=Math.min(.05,(now-(last||now))/1000);last=now;
  tickRunClock(now);
  step(dt);
  playMusic(now);
  paint();showHud();requestAnimationFrame(frame);
}
loadArtwork();hangar();fitArena();
if(typeof ResizeObserver!=='undefined')new ResizeObserver(fitArena).observe(canvas);
addEventListener('resize',fitArena);
document.addEventListener('visibilitychange',()=>{lastClock=null;});
addEventListener('pagehide',()=>{if(mode==='shop')saveShop();});
requestAnimationFrame(frame);
</script>
</html>
